

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Memories | Heavy 3D Edition</title>
    <style>
        :root {
            --neon-gold: #ffcc00;
            --cyan: #00d2ff;
            --pink: #ff00ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            height: 100vh;
            perspective: 1200px; /* The "Depth" of the room */
        }

        /* --- THE 3D STAGE --- */
        #world {
            position: relative;
            width: 100vw;
            height: 100vh;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out;
        }

        /* --- INFINITY GRID ILLUSION --- */
        .grid {
            position: absolute;
            width: 300%;
            height: 300%;
            background-image: 
                linear-gradient(var(--cyan) 1px, transparent 1px),
                linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.15;
        }

        .floor { transform: rotateX(90deg) translateZ(-400px); top: 0; }
        .ceiling { transform: rotateX(-90deg) translateZ(-400px); bottom: 0; }

        /* --- FLOATING 3D GLASS CARD --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transform: translateZ(100px); /* Pops out towards the user */
            box-shadow: 0 0 50px rgba(0,0,0,1);
            z-index: 10;
        }

        h1 {
            font-size: 6vw;
            line-height: 0.8;
            text-shadow: 8px 8px 0px var(--pink);
            margin-bottom: 20px;
        }

        .btn-3d {
            padding: 15px 40px;
            background: var(--neon-gold);
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 0 #b8860b, 0 20px 30px rgba(255, 204, 0, 0.4);
            transition: 0.1s;
        }

        .btn-3d:active {
            transform: translateY(10px);
            box-shadow: 0 0px 0 #b8860b;
        }

        /* --- FLOATING DEBRIS (Z-Space) --- */
        .debris {
            position: absolute;
            font-size: 5rem;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
        }

    </style>
</head>
<body>
<style>.danger-back {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 5000;
            background: var(--danger-red);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border: 4px solid black;
            box-shadow: 0 0 20px var(--danger-red);
            text-transform: uppercase;
            overflow: hidden;
            transition: 0.3s;
        }

        .danger-back::before {
            content: "DO NOT PRESS";
            position: absolute;
            top: -100%; left: 0;
            width: 100%; height: 100%;
            background: yellow; color: black;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; transition: 0.3s;
        }

        .danger-back:hover::before { top: 0; }
        .danger-back:hover { 
            transform: scale(1.2) rotate(5deg); 
            box-shadow: 0 0 50px var(--danger-red);
        }
</style>

     <a href="h06DoNotPress.html" class="danger-back">SYSTEM ABORT</a>
    <div id="world">
        <div class="grid floor"></div>
        <div class="grid ceiling"></div>

        <div class="debris" style="top: 10%; left: 10%; transform: translateZ(-200px);">🎓</div>
        <div class="debris" style="bottom: 20%; right: 15%; transform: translateZ(300px);">🍕</div>
        <div class="debris" style="top: 50%; right: 5%; transform: translateZ(-100px);">🎸</div>
        <div class="debris" style="bottom: 10%; left: 20%; transform: translateZ(400px);">🔥</div>

        <div class="glass-card">
            <p style="color: var(--cyan); letter-spacing: 5px; margin-bottom: 10px;">EST. 2022</p>
            <h1>CLASS OF<br><span style="color: var(--neon-gold);">LEGENDS</span></h1>
            <p style="margin: 20px 0; opacity: 0.7;">Where the chaos met the future.</p>
            <button  class="btn-3d"><a href="h06ContactFuture.html">EXPLORE THE VOID</a></button>
        </div>
    </div>

    <script>
        const world = document.getElementById('world');
        const debris = document.querySelectorAll('.debris');

        document.addEventListener('mousemove', (e) => {
            // Calculate tilt based on mouse position
            const x = (window.innerWidth / 2 - e.pageX) / 20;
            const y = (window.innerHeight / 2 - e.pageY) / 20;

            // Rotate the entire room
            world.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;

            // Subtle parallax for floating icons
            debris.forEach((item, index) => {
                const depth = (index + 1) * 0.2;
                const moveX = (window.innerWidth / 2 - e.pageX) * depth;
                const moveY = (window.innerHeight / 2 - e.pageY) * depth;
                item.style.translate = `${moveX/10}px ${moveY/10}px`;
            });
        });

        // Click Shockwave Effect
        document.addEventListener('mousedown', () => {
            world.style.transition = "transform 0.1s";
            world.style.transform += " scale(0.95) translateZ(-50px)";
        });

        document.addEventListener('mouseup', () => {
            world.style.transform = world.style.transform.replace(" scale(0.95) translateZ(-50px)", "");
        });
    </script>
</body>
</html>
